name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tipos + build + prueba de humo (hreflang, canonical, h1, CTA, 404, contenido público)
      - run: npm run ci
        env:
          SITE_URL: https://example.com
